app:
  name: ai-dify-dsl E2E template
  description: 独立集成测试，不修改现有业务 App；上游 Dify 官方样例衍生。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: '1754154032319'
      data:
        type: start
        title: Start
        desc: ''
        variables:
        - variable: query
          label: query
          type: text-input
          required: true
          max_length: 512
        selected: false
      position:
        x: 30
        y: 227
      height: 90.0
      width: 244.0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      positionAbsolute:
        x: 30
        y: 227
    - id: '1754683458843'
      data:
        type: template-transform
        title: Template
        desc: ''
        template: 已复核：{{ arg1 | upper }}
        variables:
        - variable: arg1
          value_type: string
          value_selector:
          - '1754154032319'
          - query
        isInIteration: false
        isInLoop: false
        selected: false
      position:
        x: 128
        y: 68
      height: 54.0
      width: 244.0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      zIndex: 1002
      positionAbsolute:
        x: 812
        y: 350
    - id: '1754154034161'
      data:
        type: end
        title: End
        desc: ''
        outputs:
        - variable: result
          value_type: string
          value_selector:
          - '1754683458843'
          - output
        selected: true
      position:
        x: 334
        y: 227
      height: 90.0
      width: 244.0
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      positionAbsolute:
        x: 334
        y: 227
    edges:
    - id: start-template
      source: '1754154032319'
      sourceHandle: source
      target: '1754683458843'
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: template-transform
    - id: template-end
      source: '1754683458843'
      sourceHandle: source
      target: '1754154034161'
      targetHandle: target
      type: custom
      data:
        sourceType: template-transform
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 0.7
