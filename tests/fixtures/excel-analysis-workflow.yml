app:
  description: 上传 Excel/CSV，提取 Markdown 表格并使用 Python 分析行数、列名和缺失值。
  icon: 📊
  icon_background: '#E7F3F0'
  mode: workflow
  name: Excel 表格质量分析
  use_icon_as_answer_icon: false
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
  graph:
    edges:
    - id: start-to-extract
      type: custom
      source: start
      target: extract
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: start
        targetType: document-extractor
    - id: extract-to-analyze
      type: custom
      source: extract
      target: analyze
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: document-extractor
        targetType: code
    - id: analyze-to-end
      type: custom
      source: analyze
      target: end
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: code
        targetType: end
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 120
      positionAbsolute:
        x: 80
        y: 120
      width: 244
      height: 100
      data:
        title: 上传 Excel
        desc: ''
        type: start
        variables:
        - label: Excel 文件
          variable: excel_file
          type: file
          required: true
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .xls
          - .xlsx
          - .csv
          allowed_file_upload_methods:
          - local_file
    - id: extract
      type: custom
      position:
        x: 400
        y: 120
      positionAbsolute:
        x: 400
        y: 120
      width: 244
      height: 100
      data:
        title: 提取 Excel 表格
        desc: ''
        type: document-extractor
        variable_selector:
        - start
        - excel_file
        is_array_file: false
    - id: analyze
      type: custom
      position:
        x: 730
        y: 120
      positionAbsolute:
        x: 730
        y: 120
      width: 244
      height: 100
      data:
        title: Python 表格质量分析
        desc: ''
        type: code
        code: "def main(markdown: str) -> dict:\n    import json\n    lines = markdown.splitlines()\n\
          \    tables = []\n    current = []\n    for line in lines + ['']:\n    \
          \    s = line.strip()\n        if s.startswith('|') and s.endswith('|'):\n\
          \            cells = [c.strip() for c in s.strip('|').split('|')]\n    \
          \        if all(c and set(c) <= set(':- ') for c in cells):\n          \
          \      continue\n            current.append(cells)\n        elif current:\n\
          \            if len(current) >= 2:\n                tables.append(current)\n\
          \            current = []\n    total = 0\n    blank = 0\n    details = []\n\
          \    for i, table in enumerate(tables):\n        headers = table[0]\n  \
          \      rows = table[1:]\n        nulls = sum(1 for row in rows for value\
          \ in (row + [''] * max(0, len(headers)-len(row)))[:len(headers)] if value.strip().lower()\
          \ in ('', 'nan', 'none', 'null', 'n/a', 'na'))\n        total += len(rows)\n\
          \        blank += nulls\n        details.append({'table': i + 1, 'rows':\
          \ len(rows), 'columns': headers, 'missing_cells': nulls})\n    preview =\
          \ markdown[:12000]\n    summary = ('检测到 %d 个表格，共 %d 行数据，%d 个空白单元格。' % (len(tables),\
          \ total, blank))\n    if not tables:\n        summary = '未检测到标准 Markdown\
          \ 表格，请检查原始 Excel 是否包含有效数据。'\n    return {'summary': summary, 'table_count':\
          \ len(tables), 'row_count': total, 'missing_cells': blank, 'details_json':\
          \ json.dumps(details, ensure_ascii=False), 'preview': preview}\n"
        code_language: python3
        variables:
        - variable: markdown
          value_selector:
          - extract
          - text
        outputs:
          summary:
            type: string
            children: null
          table_count:
            type: number
            children: null
          row_count:
            type: number
            children: null
          missing_cells:
            type: number
            children: null
          details_json:
            type: string
            children: null
          preview:
            type: string
            children: null
    - id: end
      type: custom
      position:
        x: 1080
        y: 120
      positionAbsolute:
        x: 1080
        y: 120
      width: 244
      height: 100
      data:
        title: 输出分析结果
        desc: ''
        type: end
        outputs:
        - variable: summary
          value_selector:
          - analyze
          - summary
        - variable: table_count
          value_selector:
          - analyze
          - table_count
        - variable: row_count
          value_selector:
          - analyze
          - row_count
        - variable: missing_cells
          value_selector:
          - analyze
          - missing_cells
        - variable: details_json
          value_selector:
          - analyze
          - details_json
        - variable: preview
          value_selector:
          - analyze
          - preview
    viewport:
      x: 0
      y: 0
      zoom: 0.8
